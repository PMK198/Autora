name: AUTORA Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
         "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        
        with:
          gradle-version: '8.9'

      - name: Build unsigned release
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.AUTORA_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.AUTORA_KEY_PASSWORD }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autora.p12"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p output
          "$TOOLS/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/autora.p12" --ks-key-alias autora --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out output/AUTORA.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose output/AUTORA.apk
          rm -f "$RUNNER_TEMP/autora.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: AUTORA-Android
          path: output/AUTORA.apk
          if-no-files-found: error
